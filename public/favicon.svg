<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .glint-v {
      animation: pulse 3s ease-in-out infinite;
    }
  </style>
  <defs>
    <mask id="v-mask">
      <rect width="32" height="32" fill="black" />
      <path d="M8 9 L16 22 L24 9 L20 9 L16 16 L12 9 Z" fill="white" />
    </mask>
  </defs>

  <rect width="32" height="32" fill="#050505" />

  <rect width="32" height="32" fill="#3D7A4D" mask="url(#v-mask)" />

  <rect class="glint-v" width="32" height="32" fill="#FFFFFF" mask="url(#v-mask)" />
</svg>
