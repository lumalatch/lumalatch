<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LUMA LATCH — VISIBLE SAFETY</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern import map – makes everything work in a module -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1?dev",
      "react-dom": "https://esm.sh/react-dom@18.3.1?dev",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.16.8",
      "@react-three/drei": "https://esm.sh/@react-three/drei@9.112.0",
      "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@2.16.2",
      "three": "https://esm.sh/three@0.168.0",
      "framer-motion": "https://esm.sh/framer-motion@11.3.31"
    }
  }
  </script>

  <script type="module" src="https://esm.sh/@google/model-viewer@3.5.0"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow-x:hidden; background:#000; font-family:sans-serif; }
    body.no-touch { cursor:none !important; }

    @font-face {
      font-family: 'Monument Extended';
      src: url('https://assets.codepen.io/383755/monument-extended-ultrabold.otf');
      font-display: swap;
    }

    .glitch {
      position: relative;
      color: #fff;
      font-size: clamp(3rem, 15vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.5rem;
      font-family: 'Monument Extended', sans-serif;
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
    }
    .glitch::before {
      animation: glitch1 0.8s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      color: #ff00c8;
    }
    .glitch::after {
      animation: glitch2 1.2s infinite;
      clip-path: polygon(0 80%, 100% 80%, 100% 100%, 0 100%);
      color: #00ffff;
    }
    @keyframes glitch1 {
      0%,100%{transform:translate(0)}
      20%{transform:translate(-8px,8px)}
      40%{transform:translate(8px,-8px)}
    }
    @keyframes glitch2 {
      0%,100%{transform:translate(0)}
      30%{transform:translate(8px,-8px)}
      70%{transform:translate(-8px,8px)}
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef, Suspense } from 'react';
    import ReactDOM from 'react-dom';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { Float, Trail, Stars, Environment, Html, OrbitControls } from '@react-three/drei';
    import { EffectComposer, Bloom, ChromaticAberration, Vignette, Noise } from '@react-three/postprocessing';
    import { motion, AnimatePresence, useMotionValue } from 'framer-motion';

    const { createRoot } = ReactDOM;

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouch) document.body.classList.add('no-touch');

    // Custom glowing cursor (desktop only)
    const CustomCursor = () => {
      if (isTouch) return null;
      const x = useMotionValue(0);
      const y = useMotionValue(0);

      useEffect(() => {
        const move = (e) => {
          x.set(e.clientX);
          y.set(e.clientY);
        };
        window.addEventListener('mousemove', move);
        return () => window.removeEventListener('mousemove', move);
      }, [x, y]);

      return (
        <>
          <motion.div
            className="fixed w-12 h-12 rounded-full bg-yellow-400 pointer-events-none z-50 mix-blend-screen shadow-2xl"
            style={{ x, y, translateX: '-50%', translateY: '-50%' }}
            animate={{ scale: [1, 1.4, 1] }}
            transition={{ repeat: Infinity, duration: 2 }}
          />
          <motion.div
            className="fixed w-64 h-64 rounded-full bg-yellow-400 pointer-events-none z-40 blur-3xl opacity-20"
            style={{ x, y, translateX: '-50%', translateY: '-50%' }}
          />
        </>
      );
    };

    // 3D LUMA Seatbelt
    function LumaSeatbelt() {
      const ref = useRef();
      const [hovered, setHovered] = useState(false);

      useFrame((state) => {
        if (ref.current) {
          ref.current.rotation.y = Math.sin(state.clock.elapsedTime * 0.4) * 0.35;
          ref.current.rotation.x = Math.sin(state.clock.elapsedTime * 0.2) * 0.15;
        }
      });

      return (
        <Float speed={1.3} rotationIntensity={0.5} floatIntensity={0.9}>
          <group
            ref={ref}
            scale={isMobile ? 2.5 : 3}
            onPointerOver={() => setHovered(true)}
            onPointerOut={() => setHovered(false)}
          >
            <mesh>
              <boxGeometry args={[1.2, 0.5, 0.25]} />
              <meshPhysicalMaterial color="#FFD700" metalness={1} roughness={0} clearcoat={1} />
            </mesh>

            <Trail width={isMobile ? 8 : 12} length={12} color="#FFFF00" attenuation={(t) => t * t}>
              <mesh position={[0, -1.2, 0]}>
                <boxGeometry args={[0.3, 2.8, 0.15]} />
                <meshPhysicalMaterial color="#FFFF99" metalness={0.6} roughness={0.2} />
              </mesh>
            </Trail>

            {hovered && (
              <Html center>
                <div className="px-6 py-3 bg-black/90 backdrop-blur border-4 border-cyan-400 rounded-2xl text-cyan-400 font-bold">
                  LUMA WEAVE™
                </div>
              </Html>
            )}
          </group>
        </Float>
      );
    }

    const Scene = () => (
      <>
        <color attach="background" args={['#000']} />
        <fog attach="fog" args={['#000', 8, 30]} />
        <ambientLight intensity={0.3} />
        <directionalLight position={[10, 10, 10]} intensity={isMobile ? 2 : 3} color="#FFD700" />
        <Stars radius={200} depth={50} count={isMobile ? 3000 : 8000} factor={6} fade speed={isMobile ? 1 : 2} />
        <Suspense fallback={null}>
          <LumaSeatbelt />
        </Suspense>
        <Environment preset="night" />
        <OrbitControls enableZoom={false} enablePan={false} autoRotate autoRotateSpeed={isMobile ? 0.3 : 0.5} />
        <EffectComposer>
          <Bloom luminanceThreshold={0.1} intensity={isMobile ? 1.8 : 3} />
          <ChromaticAberration offset={isMobile ? [0.002, 0.002] : [0.004, 0.004]} />
          <Vignette darkness={0.7} />
          <Noise opacity={0.03} />
        </EffectComposer>
      </>
    );

    const App = () => {
      const [loading, setLoading] = useState(true);
      const [blackout, setBlackout] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 2600);
        return () => clearTimeout(timer);
      }, []);

      // Voice command: say "luma", "latch", or "blackout"
      useEffect(() => {
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
          const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new Recognition();
          recognition.continuous = true;
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
            if (transcript.includes('luma') || transcript.includes('latch') || transcript.includes('blackout')) {
              setBlackout(true);
              const utter = new SpeechSynthesisUtterance("Blackout mode activated");
              speechSynthesis.speak(utter);
              setTimeout(() => setBlackout(false), 8000);
            }
          };

          recognition.start();
          return () => recognition.stop();
        }
      }, []);

      return (
        <>
          <AnimatePresence>
            {loading && (
              <motion.div
                className="fixed inset-0 bg-black flex items-center justify-center z-50"
                exit={{ opacity: 0 }}
              >
                <motion.h1 className="glitch" data-text="LUMA LATCH">
                  LUMA LATCH
                </motion.h1>
              </motion.div>
            )}
          </AnimatePresence>

          <CustomCursor />

          {/* Background video (desktop only) */}
          {!isMobile && (
            <video
              autoPlay
              muted
              loop
              playsInline
              className="fixed inset-0 object-cover w-full h-full opacity-30 -z-10"
            >
              <source src="https://assets.mixkit.co/videos/preview/mixkit-night-city-traffic-1234-large.mp4" type="video/mp4" />
            </video>
          )}

          <AnimatePresence>
            {!loading && (
              <motion.main
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                transition={{ delay: 0.4 }}
                className="relative z-10"
              >
                {/* HERO */}
                <section className="h-screen flex flex-col items-center justify-center text-center px-6">
                  <h1 className="glitch mb-8" data-text="VISIBLE SAFETY">
                    VISIBLE<br /><span className="text-yellow-400">SAFETY</span>
                  </h1>
                  <p className="text-2xl md:text-3xl text-cyan-400 tracking-widest">
                    The world's first self-illuminating seatbelt
                  </p>
                  <motion.button
                    whileHover={{ scale: 1.2 }}
                    whileTap={{ scale: 0.9 }}
                    className="mt-16 px-10 py-5 bg-yellow-400 text-black text-xl font-black rounded-full shadow-2xl"
                    onClick={() => window.open('https://google.com', '_blank')}
                  >
                    REQUEST DEMO
                  </motion.button>
                </section>

                {/* 3D Canvas */}
                <section className="h-screen relative">
                  <Canvas
                    shadows={!isMobile}
                    gl={{ antialias: !isMobile, powerPreference: "high-performance" }}
                    camera={{ position: [0, 0, 10], fov: isMobile ? 60 : 50 }}
                  >
                    <Scene />
                  </Canvas>
                </section>

                {/* AR Section */}
                <section className="h-screen flex flex-col items-center justify-center px-6 bg-black">
                  <h2 className="text-4xl md:text-6xl font-black text-yellow-400 mb-8 text-center">
                    TRY IN YOUR SPACE
                  </h2>

                  <model-viewer
                    src="https://assets.vercel.sh/seatbelt-luma.glb"
                    ar
                    ar-modes="webxr scene-viewer quick-look"
                    camera-controls
                    auto-rotate
                    shadow-intensity="1"
                    exposure="1.2"
                    style={{ width: '100%', height: '70vh', background: '#000' }}
                  >
                    <button
                      slot="ar-button"
                      className="px-12 py-7 bg-cyan-400 text-black text-3xl font-black rounded-3xl shadow-2xl"
                      style={{ bottom: '30px', left: '50%', transform: 'translateX(-50%)', position: 'absolute' }}
                    >
                      ACTIVATE AR VIEW
                    </button>
                  </model-viewer>
                </section>
              </motion.main>
            )}
          </AnimatePresence>

          {/* BLACKOUT MODE */}
          <AnimatePresence>
            {blackout && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 bg-black z-50 flex items-center justify-center text-yellow-400 text-7xl md:text-9xl font-black text-center leading-tight"
              >
                BLACKOUT<br />MODE
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
